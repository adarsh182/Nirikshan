# fly.toml app configuration file for nirikshan-backend
app = "nirikshan-backend"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  CORS_ORIGINS = "*"
  DATABASE_URL = "sqlite:////app/data/nirikshan.db"
  UPLOAD_DIR = "/app/data/uploads"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "nirikshan_data"
  destination = "/app/data"
