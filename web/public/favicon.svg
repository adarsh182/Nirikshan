<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Safe Base Feet -->
  <path d="M22 93 L24 96 L38 96 L40 93 Z" fill="#1b1244" />
  <path d="M62 93 L64 96 L78 96 L80 93 Z" fill="#1b1244" />
  <!-- Under shadow line -->
  <rect x="12" y="96" width="76" height="3" rx="1.5" fill="#1b1244" />

  <!-- Outer Safe Body -->
  <rect x="6" y="6" width="88" height="88" rx="20" fill="#ded8fe" stroke="#1b1244" stroke-width="4.5" stroke-linejoin="round" />

  <!-- Inner Vault Cavity -->
  <rect x="44" y="14" width="42" height="72" rx="12" fill="#7a68c4" stroke="#1b1244" stroke-width="4" />
  <!-- Cavity Depth Shadow -->
  <path d="M44 18 C44 14, 46 14, 52 14 L82 14 C84 14, 85 15, 85 18 L85 45 L54 45 C48 45, 44 40, 44 34 Z" fill="#58459f" />

  <!-- Case File / Evidence Dossier Folder inside Vault -->
  <path d="M50 36 L62 36 L66 40 L84 40 C85 40, 86 41, 86 42 L86 48 L50 48 Z" fill="#998135" stroke="#1b1244" stroke-width="3" stroke-linejoin="round" />
  <!-- Back Folder Sheet -->
  <rect x="50" y="44" width="37" height="32" rx="2" fill="#f4d370" stroke="#1b1244" stroke-width="3.5" />
  <!-- White Document inside Folder -->
  <rect x="52" y="41" width="33" height="10" rx="1" fill="#ffffff" stroke="#1b1244" stroke-width="2" />
  <!-- Front Folder Flap (Angled Open) -->
  <path d="M50 50 L87 50 L80 77 L49 77 Z" fill="#f8de7e" stroke="#1b1244" stroke-width="3.5" stroke-linejoin="round" />
  <path d="M50 50 L65 50 L60 77 L49 77 Z" fill="#cca63f" opacity="0.5" />

  <!-- Vault Door Hinges -->
  <rect x="12" y="24" width="5" height="10" rx="2.5" fill="#1b1244" />
  <rect x="12" y="58" width="5" height="10" rx="2.5" fill="#1b1244" />
  <circle cx="15" cy="29" r="3" fill="#b0a0e8" stroke="#1b1244" stroke-width="2.5" />
  <circle cx="15" cy="63" r="3" fill="#b0a0e8" stroke="#1b1244" stroke-width="2.5" />

  <!-- Open Safe Door (Swung to Left) -->
  <path d="M14 12 C14 10, 18 8, 24 8 L44 14 C48 15, 49 18, 49 22 L47 80 C47 84, 44 86, 40 86 L20 88 C16 88, 14 84, 14 80 Z" fill="#ded8fe" stroke="#1b1244" stroke-width="4" stroke-linejoin="round" />
  <!-- Inner Door Panel -->
  <path d="M19 16 L39 21 C41 21.5, 42 23, 42 25 L40 76 C40 78, 38 79, 36 79 L19 80 Z" fill="#beb2f4" stroke="#1b1244" stroke-width="3" stroke-linejoin="round" />

  <!-- Door Locking Bolts on Open Edge -->
  <rect x="47" y="26" width="5" height="6" rx="2" fill="#b0a0e8" stroke="#1b1244" stroke-width="2.5" />
  <rect x="46" y="62" width="5" height="6" rx="2" fill="#b0a0e8" stroke="#1b1244" stroke-width="2.5" />

  <!-- Vault Dial Combination Lock (3D circular knob) -->
  <circle cx="28" cy="46" r="10" fill="#8775ce" stroke="#1b1244" stroke-width="3" />
  <circle cx="27" cy="45" r="9" fill="#ded8fe" stroke="#1b1244" stroke-width="3" />
  <circle cx="26" cy="44" r="5" fill="#ffffff" stroke="#1b1244" stroke-width="2.5" />
  <!-- Dial Handle Bar -->
  <circle cx="26" cy="44" r="2.5" fill="#ded8fe" />
</svg>